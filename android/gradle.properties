org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false

# Kotlin's incremental compiler memory-maps its .tab caches, and on Windows
# closing them intermittently fails with "Could not close incremental caches",
# breaking plugin compilation (android_file_picker, battery_plus, ...).
# Disabling it costs time on repeat builds only.
kotlin.incremental=false
